name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26

jobs:
  checks:
    name: Format, lint, typecheck, test, and build
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deployment-smoke:
    name: Compose startup, persistence, backup, and restore
    needs: checks
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Validate the optional TLS deployment profile
        run: bash scripts/tls-config-smoke.sh

      - name: Validate and exercise the Compose stack
        run: bash scripts/compose-smoke.sh

  build-images:
    name: Build and publish ${{ matrix.target }} image
    needs: [checks, deployment-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            image: home-gallery-server
          - target: gallery
            image: home-gallery-gallery
          - target: admin
            image: home-gallery-admin
          - target: telegram-bot
            image: home-gallery-telegram-bot
    env:
      DOCKER_METADATA_SHORT_SHA_LENGTH: 12
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: BUILD_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
