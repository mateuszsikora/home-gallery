name: home-gallery

x-node-security: &node-security
  init: true
  read_only: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777

x-web-security: &web-security
  read_only: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=16m,mode=1777

services:
  server:
    <<: *node-security
    platform: linux/amd64
    image: ghcr.io/mateuszsikora/home-gallery-server:${HOME_GALLERY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      args:
        BUILD_VERSION: ${HOME_GALLERY_IMAGE_TAG:-development}
    environment:
      NODE_ENV: production
      HOME_GALLERY_ADMIN_TOKEN: ${HOME_GALLERY_ADMIN_TOKEN:?Set HOME_GALLERY_ADMIN_TOKEN}
      HOME_GALLERY_ADMIN_TOKEN_PREVIOUS: ${HOME_GALLERY_ADMIN_TOKEN_PREVIOUS:-}
      HOME_GALLERY_INGESTION_TOKEN: ${HOME_GALLERY_INGESTION_TOKEN:?Set HOME_GALLERY_INGESTION_TOKEN}
      HOME_GALLERY_INGESTION_TOKEN_PREVIOUS: ${HOME_GALLERY_INGESTION_TOKEN_PREVIOUS:-}
      HOME_GALLERY_ALLOW_ADMIN_UPLOADS: ${HOME_GALLERY_ALLOW_ADMIN_UPLOADS:-false}
      HOME_GALLERY_ADMIN_SESSION_TTL_MS: ${HOME_GALLERY_ADMIN_SESSION_TTL_MS:-28800000}
      HOME_GALLERY_ADMIN_SESSION_MAX: ${HOME_GALLERY_ADMIN_SESSION_MAX:-64}
      HOME_GALLERY_ADMIN_SESSION_SECURE: ${HOME_GALLERY_ADMIN_SESSION_SECURE:-false}
      HOME_GALLERY_AUTH_RATE_LIMIT_MAX: ${HOME_GALLERY_AUTH_RATE_LIMIT_MAX:-10}
      HOME_GALLERY_AUTH_RATE_LIMIT_WINDOW_MS: ${HOME_GALLERY_AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      HOME_GALLERY_UPLOAD_RATE_LIMIT_MAX: ${HOME_GALLERY_UPLOAD_RATE_LIMIT_MAX:-30}
      HOME_GALLERY_UPLOAD_RATE_LIMIT_WINDOW_MS: ${HOME_GALLERY_UPLOAD_RATE_LIMIT_WINDOW_MS:-60000}
      HOME_GALLERY_TRUSTED_PROXIES: ${HOME_GALLERY_TRUSTED_PROXIES:-}
      HOME_GALLERY_DATA_DIR: /var/lib/home-gallery
      HOME_GALLERY_HOST: 0.0.0.0
      HOME_GALLERY_PORT: 3012
      HOME_GALLERY_MAX_UPLOAD_BYTES: ${HOME_GALLERY_MAX_UPLOAD_BYTES:-26214400}
      HOME_GALLERY_MAX_STORED_FILES: ${HOME_GALLERY_MAX_STORED_FILES:-5000}
      HOME_GALLERY_ALLOWED_ORIGINS: ${HOME_GALLERY_ALLOWED_ORIGINS:-}
      HOME_GALLERY_LOG_LEVEL: ${HOME_GALLERY_LOG_LEVEL:-info}
      HOME_GALLERY_VERSION: ${HOME_GALLERY_IMAGE_TAG:-development}
    ports:
      - '${HOME_GALLERY_HTTP_BIND_ADDRESS:-0.0.0.0}:${HOME_GALLERY_API_PORT:-3012}:3012'
    volumes:
      - home-gallery-data:/var/lib/home-gallery
    networks:
      - home-gallery
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3012/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  gallery:
    <<: *web-security
    platform: linux/amd64
    image: ghcr.io/mateuszsikora/home-gallery-gallery:${HOME_GALLERY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: gallery
    ports:
      - '${HOME_GALLERY_HTTP_BIND_ADDRESS:-0.0.0.0}:${HOME_GALLERY_GALLERY_PORT:-3010}:8080'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - home-gallery
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  admin:
    <<: *web-security
    platform: linux/amd64
    image: ghcr.io/mateuszsikora/home-gallery-admin:${HOME_GALLERY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    ports:
      - '${HOME_GALLERY_HTTP_BIND_ADDRESS:-0.0.0.0}:${HOME_GALLERY_ADMIN_PORT:-3011}:8080'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - home-gallery
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  telegram-bot:
    <<: *node-security
    platform: linux/amd64
    image: ghcr.io/mateuszsikora/home-gallery-telegram-bot:${HOME_GALLERY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: telegram-bot
    environment:
      NODE_ENV: production
      HOME_GALLERY_TELEGRAM_BOT_TOKEN: ${HOME_GALLERY_TELEGRAM_BOT_TOKEN:?Set HOME_GALLERY_TELEGRAM_BOT_TOKEN}
      HOME_GALLERY_TELEGRAM_ALLOWED_USER_IDS: ${HOME_GALLERY_TELEGRAM_ALLOWED_USER_IDS:?Set HOME_GALLERY_TELEGRAM_ALLOWED_USER_IDS}
      HOME_GALLERY_TELEGRAM_REQUEST_TIMEOUT_MS: ${HOME_GALLERY_TELEGRAM_REQUEST_TIMEOUT_MS:-30000}
      HOME_GALLERY_TELEGRAM_MAX_DOWNLOAD_BYTES: ${HOME_GALLERY_TELEGRAM_MAX_DOWNLOAD_BYTES:-26214400}
      HOME_GALLERY_API_URL: http://server:3012
      HOME_GALLERY_INGESTION_TOKEN: ${HOME_GALLERY_INGESTION_TOKEN:?Set HOME_GALLERY_INGESTION_TOKEN}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - home-gallery
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/home-gallery-telegram-bot-ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  data-tools:
    image: alpine:3.23
    platform: linux/amd64
    profiles:
      - tools
    volumes:
      - home-gallery-data:/data
      - ${HOME_GALLERY_BACKUP_DIR:-./backups}:/backups
    networks:
      - home-gallery
    restart: 'no'

volumes:
  home-gallery-data:

networks:
  home-gallery:
    driver: bridge
